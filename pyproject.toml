[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dogear"
version = "0.1.3"
description = "Dogear — local semantic search for saved bookmarks. On-device embeddings, no cloud."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Manindra" }]
keywords = ["bookmarks", "semantic-search", "embeddings", "cli", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "fastembed>=0.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
dogear = "dogear.cli:main"

[project.urls]
Homepage = "https://github.com/manindra48/dogear"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dogear" = ["py.typed"]
